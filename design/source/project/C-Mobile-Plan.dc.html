<body>
<x-dc>

<style>
body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:#F6F1EA;color:#2B2622}
a{color:#2B2622;text-decoration:none}a:hover{color:#B84A30}
button,input{font-family:inherit;box-sizing:border-box}
button{cursor:pointer}
.rng{-webkit-appearance:none;appearance:none;background:transparent;margin:0;padding:0;cursor:pointer}
.rng::-webkit-slider-runnable-track{height:18px;background:transparent;border:0}
.rng::-moz-range-track{height:18px;background:transparent;border:0}
.rng::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;box-sizing:border-box;width:18px;height:18px;border-radius:50%;background:#FFFFFF;border:2px solid #2B2622;box-shadow:0 1px 3px rgba(43,38,34,0.18)}
.rng::-moz-range-thumb{box-sizing:border-box;width:18px;height:18px;border-radius:50%;background:#FFFFFF;border:2px solid #2B2622;box-shadow:0 1px 3px rgba(43,38,34,0.18)}
.bp{background:#B84A30}.bp:hover{background:#A4452D}.bp:active{background:#8E3A25}
.bs{background:#FFFFFF}.bs:hover{background:#FBF8F3}
.hit{position:relative}
.hit::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #2B2622;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;height:844px;display:flex;flex-direction:column;background:#F6F1EA;color:#2B2622;overflow:hidden;font-family:'Manrope',system-ui,sans-serif" id="top">

  <header style="height:56px;flex:none;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:0 6px 0 16px;border-bottom:1px solid #E6DED2">
    <svg width="26" height="26" viewBox="0 0 28 28" fill="none" aria-hidden="true" focusable="false">
      <path d="M19 10.5A6.5 6.5 0 1 1 12.5 4a5 5 0 0 0 6.5 6.5z" stroke="#2B2622" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M2.5 22.5h5l1.8-3 2.4 5 3-7 2.4 5 1.4-2h7" stroke="#B84A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <a href="#top" style="display:flex;flex-direction:column;justify-content:center;height:44px;color:#2B2622">
      <span style="font-family:'Literata',serif;font-weight:600;font-size:18px;line-height:24px">Will It Fall</span>
      <span style="font-size:12px;line-height:16px;color:#6B6159">проверка спальни на землетрясение</span>
    </a>
    <button type="button" aria-label="Меню" style="margin-left:auto;width:44px;height:44px;padding:0;border:0;border-radius:6px;background:transparent;display:flex;align-items:center;justify-content:center">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M3 6h14M3 10h14M3 14h14" stroke="#2B2622" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
  </header>

  <div style="height:52px;flex:none;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;border-bottom:1px solid #E6DED2">
    <div role="group" aria-label="Вид" style="display:flex;gap:2px;height:32px;box-sizing:border-box;padding:2px;border:1px solid #D9CFC1;border-radius:6px;background:#FFFFFF">
      <button type="button" aria-pressed="false" class="hit" style="height:26px;padding:0 14px;border:0;border-radius:4px;background:transparent;font-size:13px;line-height:18px;font-weight:500;color:#6B6159">3D</button>
      <button type="button" aria-pressed="true" class="hit" style="height:26px;padding:0 14px;border:0;border-radius:4px;background:#2B2622;font-size:13px;line-height:18px;font-weight:600;color:#FFFFFF">План</button>
    </div>
    <p style="margin:0;font-size:12px;line-height:16px;color:#6B6159;white-space:nowrap">Спальня в панельке, 3,0 × 4,2 м</p>
  </div>

    <svg viewBox="-112 -55 487.5 500" width="390" height="400" role="img" aria-label="План спальни 300 на 420 см, вид сверху. Выбран шкаф у правой стены, повёрнут на 90 градусов: его зона падения длиной 2,4 м накрывает подушку. Стеллаж у двери перекроет выход, комод сдвинется, зеркало закреплено." style="display:block">
      <defs>
        <pattern id="pHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#B84A30" stroke-width="1.3" stroke-opacity="0.5"/></pattern>
        <marker id="pArrOchre" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#8A5F17"/></marker>

      <rect x="0" y="0" width="300" height="420" fill="#FBF8F3"/>
      <rect x="20" y="0" width="160" height="200" rx="3" fill="#F6F1EA" stroke="#2B2622" stroke-width="1.2"/>
      <path d="M20,70 H180 V197 A3,3 0 0 1 177,200 H23 A3,3 0 0 1 20,197 Z" fill="#E3EAE4" stroke="#4F6E5D" stroke-width="1"/>
      <rect x="30" y="8" width="140" height="42" rx="8" fill="#FFFFFF" stroke="#2B2622" stroke-width="1"/>
      <text x="100" y="164" text-anchor="middle" font-family="Manrope, sans-serif" font-size="15" font-weight="600" fill="#2B2622">Кровать</text>
      <rect x="25" y="0" width="220" height="120" fill="rgba(184,74,48,0.12)"/>
      <rect x="25" y="0" width="220" height="120" fill="url(#pHatch)" stroke="#B84A30" stroke-width="1.2" stroke-dasharray="6 4"/>
      <rect x="70" y="300" width="200" height="80" fill="rgba(184,74,48,0.12)"/>
      <rect x="70" y="300" width="200" height="80" fill="url(#pHatch)" stroke="#B84A30" stroke-width="1.2" stroke-dasharray="6 4"/>
      <rect x="200" y="330" width="80" height="90" fill="none" stroke="#4F6E5D" stroke-width="1.2" stroke-dasharray="4 3"/>
      <path d="M200,340 A80,80 0 0 1 280,420" fill="none" stroke="#2B2622" stroke-width="0.9" stroke-dasharray="3 3"/>
      <line x1="200" y1="420" x2="200" y2="340" stroke="#2B2622" stroke-width="2.4"/>
      <text x="244" y="409" text-anchor="middle" font-family="Manrope, sans-serif" font-size="15" font-weight="700" fill="#4F6E5D" stroke="#FBF8F3" stroke-width="4" stroke-linejoin="round" paint-order="stroke">выход</text>
      <rect x="245" y="0" width="55" height="120" fill="#F4DCD3" stroke="#B84A30" stroke-width="1.6"/>
      <text x="278" y="60" transform="rotate(-90 278 60)" text-anchor="middle" font-family="Manrope, sans-serif" font-size="15" font-weight="700" fill="#2B2622">Шкаф</text>
      <rect x="270" y="300" width="30" height="80" fill="#F4DCD3" stroke="#B84A30" stroke-width="1.4"/>
      <text x="264" y="292" text-anchor="end" font-family="Manrope, sans-serif" font-size="15" font-weight="700" fill="#2B2622">Стеллаж</text>
      <rect x="0" y="270" width="45" height="100" fill="#F5EAD3" stroke="#8A5F17" stroke-width="1.4"/>
      <text x="28" y="320" transform="rotate(-90 28 320)" text-anchor="middle" font-family="Manrope, sans-serif" font-size="15" font-weight="700" fill="#2B2622">Комод</text>
      <line x1="54" y1="284" x2="98" y2="284" stroke="#8A5F17" stroke-width="2" marker-end="url(#pArrOchre)"/>
      <rect x="0" y="205" width="30" height="55" fill="#E3EAE4" stroke="#4F6E5D" stroke-width="1.4"/>
      <path d="M8,213 V225 H20" fill="none" stroke="#4F6E5D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="40" y="240" font-family="Manrope, sans-serif" font-size="15" font-weight="700" fill="#2B2622">Зеркало</text>
      <g fill="#3A332D">
        <rect x="-12" y="-12" width="62" height="12"/>
        <rect x="150" y="-12" width="162" height="12"/>
        <rect x="-12" y="0" width="12" height="432"/>

        <rect x="280" y="420" width="32" height="12"/>
      </g>
      <rect x="50" y="-12" width="100" height="12" fill="#FFFFFF" stroke="#2B2622" stroke-width="0.8"/>

      <line x1="241" y1="104" x2="29" y2="104" stroke="#2B2622" stroke-width="1" marker-start="url(#pArrInk)" marker-end="url(#pArrInk)"/>
      <text x="135" y="95" text-anchor="middle" font-family="Manrope, sans-serif" font-size="15" font-weight="700" fill="#2B2622" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">2,4 м — высота шкафа</text>
      <rect x="239" y="-6" width="67" height="132" fill="none" stroke="#2B2622" stroke-width="1.2" stroke-dasharray="5 4"/>

        <rect x="235" y="122" width="8" height="8"/>

    </ul>

    <button type="button" aria-label="Добавить предмет" class="bs" style="position:absolute;right:16px;bottom:285px;height:44px;display:flex;align-items:center;gap:8px;padding:0 16px;border:1px solid #D9CFC1;border-radius:6px;box-shadow:0 1px 3px rgba(43,38,34,0.18);font-size:14px;line-height:20px;font-weight:600;color:#2B2622;white-space:nowrap"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14" fill="none" stroke="#2B2622" stroke-width="2.25" stroke-linecap="round"/></svg>Добавить</button>

    <section aria-labelledby="sheet-title" style="position:absolute;left:0;right:0;bottom:0;height:273px;box-sizing:border-box;padding:0 16px 16px;background:#FFFFFF;border:1px solid #E6DED2;border-bottom:0;border-radius:12px 12px 0 0;box-shadow:0 12px 32px rgba(43,38,34,0.14)">
      <button type="button" aria-label="Свернуть панель" aria-expanded="true" class="hit" style="display:flex;align-items:center;justify-content:center;width:88px;height:20px;margin:0 auto;padding:0;border:0;background:transparent"><span style="display:block;width:36px;height:4px;border-radius:2px;background:#D9CFC1"></span></button>

      <div style="display:flex;align-items:baseline;gap:8px;height:28px">
        <h2 id="sheet-title" style="margin:0;font-family:'Literata',serif;font-weight:600;font-size:22px;line-height:28px">Шкаф</h2>
        <span style="font-size:13px;line-height:18px;color:#6B6159;white-space:nowrap">100 × 58 × 236 см</span>
        <span style="margin-left:auto;align-self:center;display:inline-flex;align-items:center;gap:4px;height:24px;box-sizing:border-box;padding:0 8px;border:1px solid #B84A30;border-radius:4px;background:#FFFFFF;font-size:12px;line-height:16px;font-weight:600;color:#B84A30;white-space:nowrap"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M8.5 1.5L2 8M2 3.5V8h4.5" fill="none" stroke="#B84A30" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>На подушку</span>
      </div>

      <div style="margin-top:16px;display:flex;align-items:baseline;justify-content:space-between;height:28px">
        <label for="p-angle" style="font-size:12px;line-height:16px;font-weight:600;color:#6B6159">Угол поворота</label>
        <output for="p-angle" style="font-family:'Literata',serif;font-weight:500;font-size:22px;line-height:28px;letter-spacing:-0.01em;color:#2B2622">90°</output>
      </div>
      <div style="position:relative;height:44px">
        <div aria-hidden="true" style="position:absolute;left:9px;right:9px;top:20px;height:4px;border-radius:2px;background:#E6DED2"><div style="width:25.07%;height:4px;border-radius:2px;background:#3A332D"></div></div>
        <input id="p-angle" class="rng" type="range" min="0" max="359" step="1" value="90" aria-valuetext="90 градусов" style="position:absolute;left:0;top:0;width:100%;height:44px">
      </div>
      <div aria-hidden="true" style="position:relative;height:16px;margin-top:-8px;pointer-events:none;font-size:12px;line-height:16px;color:#6B6159">
        <div style="position:absolute;left:9px;right:9px;top:0;height:16px">
          <span style="position:absolute;left:0;transform:translateX(-50%)">0°</span>
          <span style="position:absolute;left:25.07%;transform:translateX(-50%);color:#2B2622;font-weight:700">90°</span>
          <span style="position:absolute;left:50.14%;transform:translateX(-50%)">180°</span>
          <span style="position:absolute;left:75.21%;transform:translateX(-50%)">270°</span>
          <span style="position:absolute;left:100%;transform:translateX(-50%)">359°</span>
        </div>
      </div>

      <button type="button" class="bp" style="margin-top:16px;width:100%;height:44px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;border:0;border-radius:6px;color:#FFFFFF;font-size:16px;line-height:24px;font-weight:700;white-space:nowrap"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M3 2.5v10.5h10.5" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 7.5h2.5M8.5 13v-2.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/></svg>Закрепить к стене</button>
      <div style="margin-top:8px;display:flex;gap:8px">
        <button type="button" class="bs" style="flex:1;height:44px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;border:1px solid #D9CFC1;border-radius:6px;color:#2B2622;font-size:14px;line-height:20px;font-weight:600;white-space:nowrap"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" fill="none" stroke="#2B2622" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 3v5h-5" fill="none" stroke="#2B2622" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/></svg>Повернуть 90°</button>
        <button type="button" class="bs" style="flex:1;height:44px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;border:1px solid #D9CFC1;border-radius:6px;color:#2B2622;font-size:14px;line-height:20px;font-weight:600;white-space:nowrap"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6" fill="none" stroke="#2B2622" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/></svg>Удалить</button>
      </div>
    </section>
  </main>
</div>
